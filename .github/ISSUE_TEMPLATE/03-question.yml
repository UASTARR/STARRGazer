name: ❓ Question
description: Ask a general question
title: "[Question]: "
labels: ["question"]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the question you're asking.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Question
      description: A clear and concise description of your question.
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Related Areas
      description: What area of the project does this question relate to?
      options:
        - UI/UX
        - Frontend/Web
        - API/Backend
        - Performance
        - Security
        - Documentation
        - Other
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Information
      description: |
        Links? References? Anything that will give us more context about the question you are asking!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false