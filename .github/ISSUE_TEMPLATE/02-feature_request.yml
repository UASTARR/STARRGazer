name: 🚀 Feature Request
description: File a feature request/idea
title: "[Feature Request]: "
labels: ["enhancement", "triage"]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the feature you're requesting.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Feature Description
      description: A clear and concise description of what the feature is.
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Related Areas
      description: What area of the project does this feature relate to?
      options:
        - UI/UX
        - Frontend/Web
        - API/Backend
        - Performance
        - Security
        - Documentation
        - Other
    validations:
      required: false
  - type: textarea
    attributes:
      label: Use Case
      description: What is the use case for this feature? Why do you need it?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Possible Solution/Implementation
      description: |
        If you have an idea of how to implement this feature, please share it here!
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Information
      description: |
        Links? References? Anything that will give us more context about the feature you are requesting!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false